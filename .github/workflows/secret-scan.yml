# Workflow: secret-scan
#
# Zweck:  Wiederholt auf dem Server die zwei Prüfungen der lokalen Hooks.
#         1. gitleaks sucht Zugangsdaten in der gesamten Historie.
#         2. Jede Commit-Meldung eines Pull Requests muss Conventional Commits entsprechen.
# Warum:  Lokale Hooks lassen sich mit `git commit --no-verify` umgehen oder fehlen auf einem
#         frisch geklonten Rechner. Der Server ist die Prüfung, die nicht übersprungen werden kann.

name: secret-scan

on:
  push:
    branches: [main]
  pull_request:

# Nur Leserechte: Der Workflow braucht nichts zu verändern (Least Privilege).
permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Volle Historie, sonst findet gitleaks Geheimnisse in älteren Commits nicht.
          fetch-depth: 0

      - name: Install gitleaks (pinned version, checksum verified)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -O "${base}/${file}"
          curl -sSfL -O "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          # Prüfsumme gegen die Liste des Releases, damit eine manipulierte Datei auffällt.
          grep " ${file}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${file}" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      - name: Scan history for secrets
        # --redact: Fundstellen werden maskiert, damit das Geheimnis nicht im öffentlichen Log landet.
        run: gitleaks git --redact --no-banner -v

  commit-messages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check commit messages (Conventional Commits)
        # SHAs über env statt direkt im Skript: so kann kein Pull-Request-Inhalt Code einschleusen.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: .{1,72}$'
          bad=0
          while IFS= read -r subject; do
            case "$subject" in
              Merge\ *|Revert\ *|fixup!\ *|squash!\ *) continue ;;
            esac
            if ! printf '%s\n' "$subject" | grep -Eq "$pattern"; then
              echo "::error::Ungültige Commit-Meldung: ${subject}"
              bad=1
            fi
          done < <(git log --format=%s "${BASE_SHA}..${HEAD_SHA}")
          exit "$bad"
